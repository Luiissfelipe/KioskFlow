services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kioskflow
      POSTGRES_PASSWORD: kioskflow
      POSTGRES_DB: kioskflow
    ports:
      - "5433:5432"
    volumes:
      - kioskflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kioskflow -d kioskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kioskflow-pgdata:
